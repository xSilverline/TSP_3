[Settings]

inputFileName=matrix_15.txt

outputFileName=result.xls

numberOfRepeats=10
# in ms
killSwitch=30000
#only in NN method
startingNode=0

# only for testing! Runs every matrix
test= false
# print results
print = true

# ts - Taboo Search  / sa - Simulated Annealing / all - every method at once
chooseMethod=sa

#0 - random / 1 - NN
firstNodeMethod=0

# number of iterations without improvement
iterations=-1

# ------------ Taboo Search ------------

tabuSize=10

cadencyTime=10

aspiration=0

# ------------- Simulated Annealing ---------

temperature=3000

coolingRate=0.99

finalTemp=1e-10

# 0 - geometric / 1 - logarithmic
coolingMethod=0
# 0 - swap / 1 - invert
neighbourMethod=1